app:
  name: VitalMart
  disclaimer: >-
    Ez a jelentés fogyasztói okosóra adatain alapuló, tájékoztató jellegű elemzés.
    Nem orvosi diagnózis, nem helyettesíti az orvosi vizsgálatot vagy tanácsot.
    Az eszközök mérési pontossága korlátozott. Ha panaszai vannak, vagy az értékek
    aggasztják, forduljon orvoshoz; sürgős tünet esetén hívja a 112-t.

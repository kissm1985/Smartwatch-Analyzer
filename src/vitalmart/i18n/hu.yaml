  empty:
    title: "Még nincs betöltött adat. Exportáld az órád adatait, és töltsd be az Import oldalon."
    apple_title: "Apple Health / Apple Watch export"
    apple_steps: |
      1. Nyisd meg az iPhone-on az **Egészség** appot.
      2. Jobb felül a profilképed → **Összes egészségügyi adat exportálása** → Exportálás.
      3. Az elkészült ZIP-et (magyar iOS-en: `exportálás.zip`) másold át a gépedre.
      4. Az **Import** oldalon töltsd fel, vagy add meg a helyi útvonalát.
    garmin_title: "Garmin Connect export"
    garmin_steps: |
      1. connect.garmin.com → **Fiókbeállítások → Adatkezelés → Adatok exportálása** → Kérelem.
      2. Az e-mailben kapott linkről töltsd le a ZIP-et.
      3. Az **Import** oldalon töltsd fel, vagy add meg a helyi útvonalát.
      4. Napon belüli pulzushoz/stresszhez az óra `GARMIN/Monitor` mappája (USB) is betölthető.

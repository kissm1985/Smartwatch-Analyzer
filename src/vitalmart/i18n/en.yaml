  empty:
    title: "No data yet. Export your watch data and load it on the Import page."
    apple_title: "Apple Health / Apple Watch export"
    apple_steps: |
      1. Open the **Health** app on the iPhone.
      2. Profile picture → **Export All Health Data** → Export.
      3. Copy the ZIP to your computer.
      4. Upload it on the **Import** page or enter its local path.
    garmin_title: "Garmin Connect export"
    garmin_steps: |
      1. connect.garmin.com → **Account Settings → Data Management → Export Your Data** → Request.
      2. Download the ZIP from the e-mail link.
      3. Upload it on the **Import** page or enter its local path.
      4. For intraday HR/stress also load the watch's `GARMIN/Monitor` folder (USB).

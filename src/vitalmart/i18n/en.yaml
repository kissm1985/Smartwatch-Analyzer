app:
  name: VitalMart
  disclaimer: >-
    This report is an informational analysis based on consumer smartwatch data.
    It is not a medical diagnosis and does not replace medical examination or advice.
    Device accuracy is limited. If you have symptoms or the values concern you,
    see a doctor; in an emergency call 112.

# Metrika-katalógus (dim_metric). A kód angol, a nevek hu/en.
# agg: SUM | AVG | MIN | MAX | LAST ; better: higher | lower | neutral
# valid_min / valid_max: fiziológiai/technikai érvényességi tartomány (SPEC 4.5);
# az ezen kívül eső értékek quality_flag = 'out_of_range' jelölést kapnak (nem törlődnek).
metrics:
  heart_rate:        {name_hu: Pulzus, name_en: Heart rate, category: heart, unit: bpm, agg: AVG, better: neutral, valid_min: 25, valid_max: 230}
  resting_hr:        {name_hu: Nyugalmi pulzus, name_en: Resting heart rate, category: heart, unit: bpm, agg: AVG, better: lower, valid_min: 25, valid_max: 150}
  walking_hr_avg:    {name_hu: Séta közbeni átlagpulzus, name_en: Walking heart rate average, category: heart, unit: bpm, agg: AVG, better: lower, valid_min: 25, valid_max: 230}
  hrv_sdnn:          {name_hu: Szívfrekvencia-variabilitás (SDNN), name_en: Heart rate variability (SDNN), category: heart, unit: ms, agg: AVG, better: higher, valid_min: 1, valid_max: 400, note: "HRV módszer: SDNN (Apple Watch). RMSSD-vel nem hasonlítható össze."}
  hrv_rmssd:         {name_hu: Szívfrekvencia-variabilitás (RMSSD), name_en: Heart rate variability (RMSSD), category: heart, unit: ms, agg: AVG, better: higher, valid_min: 1, valid_max: 400, note: "HRV módszer: RMSSD (Garmin). SDNN-nel nem hasonlítható össze."}
  hr_recovery_1min:  {name_hu: Pulzus-visszaesés (1 perc), name_en: Heart rate recovery (1 min), category: heart, unit: bpm, agg: AVG, better: higher, valid_min: 0, valid_max: 120}
  steps:             {name_hu: Lépésszám, name_en: Steps, category: activity, unit: count, agg: SUM, better: higher, valid_min: 0, valid_max: 100000}
  distance_walk_run: {name_hu: Gyaloglás/futás távolság, name_en: Walking + running distance, category: activity, unit: km, agg: SUM, better: higher, valid_min: 0, valid_max: 300}
  active_energy:     {name_hu: Aktív energia, name_en: Active energy, category: activity, unit: kcal, agg: SUM, better: higher, valid_min: 0, valid_max: 15000}
  basal_energy:      {name_hu: Nyugalmi energia, name_en: Basal energy, category: activity, unit: kcal, agg: SUM, better: neutral, valid_min: 0, valid_max: 10000}
  exercise_time:     {name_hu: Edzésidő, name_en: Exercise time, category: activity, unit: min, agg: SUM, better: higher, valid_min: 0, valid_max: 1440}
  stand_time:        {name_hu: Állással töltött idő, name_en: Stand time, category: activity, unit: min, agg: SUM, better: higher, valid_min: 0, valid_max: 1440}
  flights_climbed:   {name_hu: Megmászott emeletek, name_en: Flights climbed, category: activity, unit: count, agg: SUM, better: higher, valid_min: 0, valid_max: 2000}
  vo2max:            {name_hu: VO₂max becslés, name_en: VO2max estimate, category: activity, unit: mL/(kg·min), agg: AVG, better: higher, valid_min: 10, valid_max: 95}
  spo2:              {name_hu: Véroxigén-szint (SpO₂), name_en: Blood oxygen (SpO2), category: respiration, unit: "%", agg: AVG, better: higher, valid_min: 70, valid_max: 100}
  respiratory_rate:  {name_hu: Légzésszám, name_en: Respiratory rate, category: respiration, unit: breaths/min, agg: AVG, better: neutral, valid_min: 4, valid_max: 60}
  body_mass:         {name_hu: Testsúly, name_en: Body mass, category: body, unit: kg, agg: LAST, better: neutral, valid_min: 20, valid_max: 350}
  body_fat_pct:      {name_hu: Testzsír, name_en: Body fat, category: body, unit: "%", agg: LAST, better: lower, valid_min: 2, valid_max: 70}
  lean_body_mass:    {name_hu: Zsírmentes testtömeg, name_en: Lean body mass, category: body, unit: kg, agg: LAST, better: neutral, valid_min: 10, valid_max: 200}
  bmi:               {name_hu: Testtömegindex (BMI), name_en: Body mass index, category: body, unit: kg/m², agg: LAST, better: neutral, valid_min: 8, valid_max: 90}
  height:            {name_hu: Testmagasság, name_en: Height, category: body, unit: m, agg: LAST, better: neutral, valid_min: 0.5, valid_max: 2.6}
  sleep_duration:    {name_hu: Alvásidő, name_en: Sleep duration, category: sleep, unit: min, agg: SUM, better: higher, valid_min: 0, valid_max: 1440}
  stress:            {name_hu: Stressz (Garmin), name_en: Stress (Garmin), category: stress, unit: score, agg: AVG, better: lower, valid_min: 0, valid_max: 100}
  body_battery:      {name_hu: Body Battery (Garmin), name_en: Body Battery (Garmin), category: stress, unit: score, agg: LAST, better: higher, valid_min: 0, valid_max: 100}
  # Apple napi összesítő (ActivitySummary) – forrásoldali napi összesítő
  summary_active_energy:  {name_hu: Mozgás-gyűrű (aktív energia), name_en: Move ring active energy, category: activity, unit: kcal, agg: SUM, better: higher, valid_min: 0, valid_max: 15000}
  summary_exercise_time:  {name_hu: Edzés-gyűrű (perc), name_en: Exercise ring minutes, category: activity, unit: min, agg: SUM, better: higher, valid_min: 0, valid_max: 1440}
  summary_stand_hours:    {name_hu: Állás-gyűrű (óra), name_en: Stand ring hours, category: activity, unit: count, agg: SUM, better: higher, valid_min: 0, valid_max: 24}
  # Garmin-specifikus (a Garmin napi összesítőből és alvásadatokból)
  stress_awake:           {name_hu: Stressz ébren (Garmin), name_en: Stress awake (Garmin), category: stress, unit: score, agg: AVG, better: lower, valid_min: 0, valid_max: 100}
  stress_asleep:          {name_hu: Stressz alvás közben (Garmin), name_en: Stress asleep (Garmin), category: stress, unit: score, agg: AVG, better: lower, valid_min: 0, valid_max: 100}
  stress_max:             {name_hu: Maximális stressz (Garmin), name_en: Max stress (Garmin), category: stress, unit: score, agg: MAX, better: lower, valid_min: 0, valid_max: 100}
  stress_high_min:        {name_hu: Magas stresszű idő, name_en: High stress time, category: stress, unit: min, agg: SUM, better: lower, valid_min: 0, valid_max: 1440}
  stress_medium_min:      {name_hu: Közepes stresszű idő, name_en: Medium stress time, category: stress, unit: min, agg: SUM, better: lower, valid_min: 0, valid_max: 1440}
  stress_low_min:         {name_hu: Alacsony stresszű idő, name_en: Low stress time, category: stress, unit: min, agg: SUM, better: neutral, valid_min: 0, valid_max: 1440}
  stress_rest_min:        {name_hu: Pihenési idő (stressz), name_en: Rest time (stress), category: stress, unit: min, agg: SUM, better: higher, valid_min: 0, valid_max: 1440}
  stress_measured_min:    {name_hu: Stresszmérés időtartama, name_en: Stress measured time, category: stress, unit: min, agg: SUM, better: neutral, valid_min: 0, valid_max: 1440}
  body_battery_sleep_start: {name_hu: Body Battery elalváskor, name_en: Body Battery at sleep start, category: stress, unit: score, agg: AVG, better: neutral, valid_min: 0, valid_max: 100}
  body_battery_sleep_end: {name_hu: Body Battery ébredéskor, name_en: Body Battery at wake, category: stress, unit: score, agg: AVG, better: higher, valid_min: 0, valid_max: 100}
  body_battery_charged:   {name_hu: Body Battery töltődés, name_en: Body Battery charged, category: stress, unit: score, agg: SUM, better: higher, valid_min: 0, valid_max: 200}
  body_battery_drained:   {name_hu: Body Battery merülés, name_en: Body Battery drained, category: stress, unit: score, agg: SUM, better: neutral, valid_min: 0, valid_max: 200}
  respiration_max:        {name_hu: Légzésszám maximum, name_en: Respiration max, category: respiration, unit: breaths/min, agg: MAX, better: neutral, valid_min: 4, valid_max: 60}
  respiration_min:        {name_hu: Légzésszám minimum, name_en: Respiration min, category: respiration, unit: breaths/min, agg: MIN, better: neutral, valid_min: 2, valid_max: 60}
  hydration_intake:       {name_hu: Folyadékbevitel, name_en: Hydration intake, category: body, unit: mL, agg: SUM, better: neutral, valid_min: 0, valid_max: 15000}
  sweat_loss:             {name_hu: Becsült izzadási veszteség, name_en: Estimated sweat loss, category: body, unit: mL, agg: SUM, better: neutral, valid_min: 0, valid_max: 15000}
  active_time:            {name_hu: Aktív idő, name_en: Active time, category: activity, unit: min, agg: SUM, better: higher, valid_min: 0, valid_max: 1440}
  highly_active_time:     {name_hu: Nagyon aktív idő, name_en: Highly active time, category: activity, unit: min, agg: SUM, better: higher, valid_min: 0, valid_max: 1440}
  sleep_score:            {name_hu: Alvás-pontszám (Garmin), name_en: Sleep score (Garmin), category: sleep, unit: score, agg: AVG, better: higher, valid_min: 0, valid_max: 100, note: "Forrásfüggő, gyártói algoritmus."}
  sleep_score_quality:    {name_hu: Alvásminőség-pontszám (Garmin), name_en: Sleep quality score (Garmin), category: sleep, unit: score, agg: AVG, better: higher, valid_min: 0, valid_max: 100}
  sleep_score_duration:   {name_hu: Alvásidő-pontszám (Garmin), name_en: Sleep duration score (Garmin), category: sleep, unit: score, agg: AVG, better: higher, valid_min: 0, valid_max: 100}
  sleep_score_recovery:   {name_hu: Regenerációs pontszám (Garmin), name_en: Sleep recovery score (Garmin), category: sleep, unit: score, agg: AVG, better: higher, valid_min: 0, valid_max: 100}
  spo2_sleep_min:         {name_hu: Legalacsonyabb SpO₂ alvás közben, name_en: Lowest SpO2 during sleep, category: respiration, unit: "%", agg: MIN, better: higher, valid_min: 50, valid_max: 100}
  sleep_awake_count:      {name_hu: Ébredések száma, name_en: Awakenings, category: sleep, unit: count, agg: SUM, better: lower, valid_min: 0, valid_max: 100}
  sleep_restless_moments: {name_hu: Nyugtalan pillanatok, name_en: Restless moments, category: sleep, unit: count, agg: SUM, better: lower, valid_min: 0, valid_max: 1000}

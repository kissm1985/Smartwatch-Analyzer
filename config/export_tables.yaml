  ma7: {label: "7 napos mozgóátlag", desc: "7 napos mozgóátlag (a mérőszám egységében)."}
  med7: {label: "7 napos medián", desc: "7 napos mozgó medián."}
  n28: {label: "Érvényes napok (28)", unit: "nap", desc: "Érvényes napok száma a 28 napos ablakban."}

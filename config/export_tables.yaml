# Exportálható táblák (SPEC 8.2) – nyers / származtatott adatok XLSX, CSV, Parquet formátumban.
#
# Minden táblánál:
#   sql:    a lekérdezés törzse (SELECT … FROM … JOIN …) WHERE nélkül
#   date:   dátum-kifejezés (DATE) az időszakszűréshez – üres: nincs időszakszűrés
#   person: személykulcs-kifejezés a személyszűréshez – üres: nincs személyszűrés
#   order:  rendezés
# A felhasználói értékek (időszak, személyek) mindig SQL-paraméterek; a táblanév csak
# ebből a listából választható.

version: 1

tables:
  fact_daily_summary:
    label_hu: "Napi összesítők"
    sheet: "Napi összesítő"
    group: fact
    sql: |
      SELECT d.date, s.person_key, s.vendor, t.* EXCLUDE (date_key, import_batch_id)
      FROM fact_daily_summary t JOIN dim_date d USING (date_key)
      JOIN dim_source s ON s.source_key = t.source_key
    date: d.date
    person: s.person_key
    order: d.date, t.source_key

  fact_sleep_session:
    label_hu: "Alvások"
    sheet: "Alvás"
    group: fact
    sql: |
      SELECT s.person_key, s.vendor, t.* EXCLUDE (sleep_date_key, import_batch_id)
      FROM fact_sleep_session t JOIN dim_source s ON s.source_key = t.source_key
    date: t.sleep_date
    person: s.person_key
    order: t.start_utc

  fact_sleep_stage_interval:
    label_hu: "Alvásfázis-szakaszok"
    sheet: "Alvásfázisok"
    group: fact
    sql: |
      SELECT CAST(t.start_local AS DATE) AS date, s.person_key, t.* EXCLUDE (import_batch_id)
      FROM fact_sleep_stage_interval t JOIN dim_source s ON s.source_key = t.source_key
    date: CAST(t.start_local AS DATE)
    person: s.person_key
    order: t.start_utc

  fact_hrv_nightly:
    label_hu: "Éjszakai HRV"
    sheet: "HRV"
    group: fact
    sql: |
      SELECT s.person_key, s.vendor, t.* EXCLUDE (sleep_date_key, import_batch_id)
      FROM fact_hrv_nightly t JOIN dim_source s ON s.source_key = t.source_key
    date: t.sleep_date
    person: s.person_key
    order: t.sleep_date, t.source_key

  fact_heart_rate_sample:
    label_hu: "Pulzusminták (nagy tábla)"
    sheet: "Pulzusminták"
    group: fact
    large: true
    sql: |
      SELECT d.date, s.person_key, t.* EXCLUDE (date_key, import_batch_id)
      FROM fact_heart_rate_sample t JOIN dim_date d USING (date_key)
      JOIN dim_source s ON s.source_key = t.source_key
    date: d.date
    person: s.person_key
    order: t.ts_utc, t.source_key

  fact_stress_sample:
    label_hu: "Stresszminták"
    sheet: "Stresszminták"
    group: fact
    large: true
    sql: |
      SELECT d.date, s.person_key, t.* EXCLUDE (date_key, import_batch_id)
      FROM fact_stress_sample t JOIN dim_date d USING (date_key)
      JOIN dim_source s ON s.source_key = t.source_key
    date: d.date
    person: s.person_key
    order: t.ts_utc, t.source_key

  fact_measurement:
    label_hu: "Egyéb mérések (általános tény)"
    sheet: "Mérések"
    group: fact
    large: true
    sql: |
      SELECT d.date, s.person_key, m.name_hu AS metric_name, t.* EXCLUDE (date_key, import_batch_id, record_nk)
      FROM fact_measurement t JOIN dim_date d USING (date_key)
      JOIN dim_source s ON s.source_key = t.source_key
      LEFT JOIN dim_metric m ON m.metric_key = t.metric_key
    date: d.date
    person: s.person_key
    order: t.metric_key, t.ts_utc

  fact_activity:
    label_hu: "Edzések / tevékenységek"
    sheet: "Edzések"
    group: fact
    sql: |
      SELECT d.date, s.person_key, a.unified_name_hu AS activity_name, t.* EXCLUDE (date_key, import_batch_id)
      FROM fact_activity t JOIN dim_date d USING (date_key)
      JOIN dim_source s ON s.source_key = t.source_key
      LEFT JOIN dim_activity_type a ON a.activity_type_key = t.activity_type_key
    date: d.date
    person: s.person_key
    order: t.start_utc

  fact_activity_hr_zone:
    label_hu: "Edzések pulzuszónái"
    sheet: "Pulzuszónák"
    group: fact
    sql: |
      SELECT CAST(a.start_local AS DATE) AS date, s.person_key, t.* EXCLUDE (import_batch_id)
      FROM fact_activity_hr_zone t
      JOIN fact_activity a ON a.activity_id = t.activity_id AND a.source_key = t.source_key
      JOIN dim_source s ON s.source_key = t.source_key
    date: CAST(a.start_local AS DATE)
    person: s.person_key
    order: a.start_utc, t.zone

  fact_body_measure:
    label_hu: "Testösszetétel"
    sheet: "Testösszetétel"
    group: fact
    sql: |
      SELECT d.date, s.person_key, t.* EXCLUDE (date_key, import_batch_id)
      FROM fact_body_measure t JOIN dim_date d USING (date_key)
      JOIN dim_source s ON s.source_key = t.source_key
    date: d.date
    person: s.person_key
    order: t.ts_utc

  fact_vo2max:
    label_hu: "VO₂max"
    sheet: "VO2max"
    group: fact
    sql: |
      SELECT d.date, s.person_key, t.* EXCLUDE (date_key, import_batch_id)
      FROM fact_vo2max t JOIN dim_date d USING (date_key)
      JOIN dim_source s ON s.source_key = t.source_key
    date: d.date
    person: s.person_key
    order: d.date

  derived_person_daily:
    label_hu: "Személyenkénti napi idősorok (elsődleges forrás)"
    sheet: "Napi idősorok"
    group: derived
    sql: |
      SELECT t.date, t.person_key, t.metric_key, m.name_hu AS metric_name, m.unit, t.value,
             t.source_key, t.n_sources
      FROM derived_person_daily t LEFT JOIN dim_metric m ON m.metric_key = t.metric_key
    date: t.date
    person: t.person_key
    order: t.metric_key, t.date

  derived_daily_stats:
    label_hu: "Mozgóátlagok, alapvonal, z-pontszám"
    sheet: "Napi statisztikák"
    group: derived
    sql: |
      SELECT t.* EXCLUDE (date_key) FROM derived_daily_stats t
    date: t.date
    person: t.person_key
    order: t.metric_key, t.date

  derived_weekly_activity:
    label_hu: "Heti aktivitás (WHO-egyenértékes percek)"
    sheet: "Heti aktivitás"
    group: derived
    sql: |
      SELECT t.* FROM derived_weekly_activity t
    date: t.week_start
    person: t.person_key
    order: t.week_start

  derived_sleep_regularity:
    label_hu: "Alvásrendszeresség, alvási adósság"
    sheet: "Alvásrendszeresség"
    group: derived
    sql: |
      SELECT t.* EXCLUDE (date_key) FROM derived_sleep_regularity t
    date: t.date
    person: t.person_key
    order: t.date

  derived_training_load:
    label_hu: "Edzésterhelés (akut:krónikus arány)"
    sheet: "Edzésterhelés"
    group: derived
    sql: |
      SELECT t.* EXCLUDE (date_key) FROM derived_training_load t
    date: t.date
    person: t.person_key
    order: t.date

  dq_coverage:
    label_hu: "Adatminőség: lefedettség"
    sheet: "DQ lefedettség"
    group: quality
    sql: |
      SELECT t.* FROM dq_coverage t
    date: ""
    person: t.person_key
    order: t.person_key, t.source_key, t.metric_key

  dq_gap:
    label_hu: "Adatminőség: adathiányos időszakok"
    sheet: "DQ hiányok"
    group: quality
    sql: |
      SELECT t.* FROM dq_gap t
    date: t.gap_start
    person: t.person_key
    order: t.gap_start

  dq_nonwear:
    label_hu: "Adatminőség: nem viselt / töltési időszakok"
    sheet: "DQ nem viselt"
    group: quality
    sql: |
      SELECT t.* FROM dq_nonwear t
    date: CAST(t.start_local AS DATE)
    person: t.person_key
    order: t.start_utc

  dim_source:
    label_hu: "Adatforrások (eszközök)"
    sheet: "Források"
    group: dimension
    sql: |
      SELECT t.* FROM dim_source t
    date: ""
    person: t.person_key
    order: t.source_key

  dim_activity_type:
    label_hu: "Tevékenységtípusok"
    sheet: "Tevékenységtípusok"
    group: dimension
    sql: |
      SELECT t.* FROM dim_activity_type t
    date: ""
    person: ""
    order: t.activity_type_key

  dim_event:
    label_hu: "Események / megjegyzések"
    sheet: "Események"
    group: dimension
    sql: |
      SELECT t.* FROM dim_event t
    date: t.start_date
    person: ""
    order: t.start_date

# Alapértelmezett kiválasztás az Export oldalon
default_tables:
  - fact_daily_summary
  - fact_sleep_session
  - fact_hrv_nightly
  - fact_activity
  - derived_person_daily

# Oszlopszótár: magyar megnevezés, mértékegység, leírás. A mértékegység a fejlécbe kerül
# ("Lépésszám [lépés]"); ami itt nem szerepel, annál a technikai név és – ha van – az
# utótag szerinti mértékegység (suffix_units) jelenik meg.
suffix_units:
  _min: perc
  _kcal: kcal
  _km: km
  _kmh: km/h
  _pct: "%"
  _ms: ms
  _h: óra
  _kg: kg
  _cm: cm
  _m: m

columns:
  date: {label: "Dátum", desc: "Helyi naptári nap (alvásnál: az ébredés napja, ha nincs külön jelölve)."}
  person_key: {label: "Személy", desc: "A háztartás tagjának azonosítója (dim_person)."}
  vendor: {label: "Gyártó", desc: "Az adatforrás gyártója (apple / garmin)."}
  source_key: {label: "Forrás", desc: "Az eszköz / alkalmazás belső kulcsa (dim_source)."}
  source_name: {label: "Forrás neve", desc: "Az eszköz vagy alkalmazás neve az exportban."}
  device_type: {label: "Eszköztípus", desc: "watch / phone / scale / app / other."}
  device_model: {label: "Eszközmodell", desc: "Az eszköz modellje, ha az export tartalmazza."}
  quality_flag: {label: "Minőségjelző", desc: "ok / suspect / invalid / duplicate / gap_filled – a betöltéskori validáció eredménye."}
  ts_utc: {label: "Időpont (UTC)", desc: "A mérés időpontja koordinált világidőben."}
  ts_local: {label: "Időpont (helyi)", desc: "A mérés időpontja helyi időben."}
  tz_offset_min: {label: "Időzóna-eltolás", unit: "perc", desc: "A helyi idő eltérése az UTC-től percben."}
  start_utc: {label: "Kezdet (UTC)", desc: "Kezdő időpont UTC-ben."}
  end_utc: {label: "Vég (UTC)", desc: "Záró időpont UTC-ben."}
  start_local: {label: "Kezdet (helyi)", desc: "Kezdő időpont helyi időben."}
  end_local: {label: "Vég (helyi)", desc: "Záró időpont helyi időben."}
  end_ts_utc: {label: "Vég (UTC)", desc: "Időtartamos mérés vége UTC-ben."}
  end_ts_local: {label: "Vég (helyi)", desc: "Időtartamos mérés vége helyi időben."}
  minute_of_day: {label: "Nap perce", unit: "perc", desc: "A helyi idő éjfél óta eltelt perceinek száma (0–1439)."}
  steps: {label: "Lépésszám", unit: "lépés", desc: "Napi lépésszám."}
  distance_km: {label: "Távolság", unit: "km", desc: "Megtett távolság."}
  active_kcal: {label: "Aktív energia", unit: "kcal", desc: "Mozgással elhasznált energia (gyártói becslés)."}
  basal_kcal: {label: "Nyugalmi energia", unit: "kcal", desc: "Alapanyagcsere becsült energiája."}
  total_kcal: {label: "Összes energia", unit: "kcal", desc: "Aktív + nyugalmi energia."}
  flights_climbed: {label: "Megmászott emeletek", unit: "emelet", desc: "Megmászott emeletek száma."}
  exercise_min: {label: "Edzésperc", unit: "perc", desc: "Apple Edzés-gyűrű percei."}
  stand_min: {label: "Állás", unit: "perc", desc: "Állással töltött idő (Apple)."}
  moderate_min: {label: "Mérsékelt intenzitás", unit: "perc", desc: "Mérsékelt intenzitású percek (Garmin)."}
  vigorous_min: {label: "Intenzív intenzitás", unit: "perc", desc: "Intenzív percek (Garmin)."}
  resting_hr: {label: "Nyugalmi pulzus", unit: "bpm", desc: "A gyártó által számolt napi nyugalmi pulzus."}
  walking_hr_avg: {label: "Séta közbeni pulzus", unit: "bpm", desc: "Átlagos pulzus séta közben (Apple)."}
  hr_min: {label: "Legalacsonyabb pulzus", unit: "bpm", desc: "Legalacsonyabb pulzus az adott egységben."}
  hr_max: {label: "Legmagasabb pulzus", unit: "bpm", desc: "Legmagasabb pulzus az adott egységben."}
  hr_avg: {label: "Átlagos pulzus", unit: "bpm", desc: "Átlagos pulzus az adott egységben."}
  hr_sample_count: {label: "Pulzusminták száma", unit: "db", desc: "A napi pulzusminták száma."}
  stress_avg: {label: "Átlagos stressz", unit: "pont", desc: "Garmin stresszpontszám (0–100) átlaga."}
  body_battery_max: {label: "Body Battery max.", unit: "pont", desc: "Garmin Body Battery napi maximuma."}
  body_battery_min: {label: "Body Battery min.", unit: "pont", desc: "Garmin Body Battery napi minimuma."}
  spo2_avg: {label: "Átlagos SpO₂", unit: "%", desc: "Átlagos véroxigén-telítettség (csuklón mért, tájékoztató)."}
  spo2_min: {label: "Legalacsonyabb SpO₂", unit: "%", desc: "Legalacsonyabb véroxigén-telítettség (tájékoztató)."}
  respiratory_rate_avg: {label: "Légzésszám", unit: "légzés/perc", desc: "Átlagos légzésszám."}

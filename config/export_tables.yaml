  deep_min: {label: "Mélyalvás", unit: "perc", desc: "Mélyalvás ideje (eszközfüggő becslés)."}
  light_min: {label: "Könnyű alvás", unit: "perc", desc: "Könnyű / core alvás ideje (eszközfüggő becslés)."}

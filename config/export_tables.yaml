  baseline_low_ms: {label: "HRV alapvonal alsó", unit: "ms", desc: "Gyártói alapvonal alsó határa."}
  baseline_high_ms: {label: "HRV alapvonal felső", unit: "ms", desc: "Gyártói alapvonal felső határa."}
  sample_count: {label: "Mintaszám", unit: "db", desc: "A számításhoz felhasznált minták száma."}
  bpm: {label: "Pulzus", unit: "bpm", desc: "Pulzusminta."}
  context: {label: "Környezet", desc: "A mérés körülménye (pl. nyugalom, edzés), ha ismert."}
  stress: {label: "Stressz", unit: "pont", desc: "Garmin stresszpontszám (0–100)."}
  category: {label: "Kategória", desc: "Kategória."}
  metric_key: {label: "Mérőszám kulcs", desc: "A mérőszám technikai kulcsa (lásd: Mérőszámok munkalap)."}
  metric_name: {label: "Mérőszám", desc: "A mérőszám magyar neve."}
  value: {label: "Érték", desc: "A mérés értéke a mérőszám mértékegységében."}
  value_text: {label: "Szöveges érték", desc: "Kategória jellegű mérés értéke."}
  unit: {label: "Mértékegység", desc: "Az érték mértékegysége."}
  activity_id: {label: "Edzés azonosító", desc: "Az edzés belső azonosítója."}

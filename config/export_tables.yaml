  med28: {label: "28 napos medián", desc: "28 napos mozgó medián."}
  trend_7v28: {label: "Trend (7 vs. 28 nap)", desc: "A 7 és 28 napos átlag különbsége."}
  bl_n: {label: "Alapvonal napjai", unit: "nap", desc: "A személyes alapvonalhoz felhasznált napok."}
  bl_mean: {label: "Alapvonal átlag", desc: "Személyes alapvonal (gördülő, a napot megelőző időszakból)."}
  bl_std: {label: "Alapvonal szórás", desc: "Az alapvonal szórása."}

# VitalMart alkalmazás-konfiguráció
# Az adatmappa relatív útvonala a projekt gyökeréhez képest értendő.
# Felülírható a VITALMART_DATA_DIR környezeti változóval.
data_dir: data
db_file: vitalmart.duckdb
timezone: Europe/Budapest
language: hu
# Személy, akihez az import alapértelmezésben tartozik (import --person felülírja).
# Több személy (pl. pár) adatai külön kezelhetők; egy eszköz csak egy személyé lehet.
default_person: me

sleep:
  # Alvásnap-konvenció: "wake" = az ébredés napja (alapértelmezett, SPEC 4.4),
  # "start" = az elalvás (lefekvés) napja.
  day_convention: wake
  goal_hours: 7.5
  # Két alvási intervallum ugyanahhoz az alvási szakaszhoz tartozik,
  # ha a köztük lévő szünet ennél rövidebb (perc).
  session_gap_minutes: 90
  # Ennél hosszabb egyetlen alvási intervallum (pl. egy app 20 órás „ágyban” rekordja)
  # valószínűtlen: megjelölve megmarad, de a szakaszképzésből kimarad.
  max_interval_hours: 16

import:
  chunk_size: 50000

database:
  # DuckDB memóriakorlát; e fölött az adatmappa tmp/ alkönyvtárába lapoz (SPEC 4.2: < 4 GB RAM).
  memory_limit: 2GB
  threads: null      # null = összes mag

# Származtatott mutatók (SPEC 5.4) – személyenként
derived:
  # Elsődleges forrás kiválasztása személyenként, naponként, metrikánként:
  # az eszköztípusok sorrendje (az első, amelyiknek aznap van érvényes értéke).
  source_priority: [watch, phone, summary, app, other]
  # Metrikánkénti felülírás: metric_key -> source_key (pl. steps: "apple:Az iPhone-om").
  # Az M4 Beállítások oldal ezt fogja szerkeszteni.
  primary_source: {}
  baseline_window_days: 60     # személyes alapvonal: a megelőző N nap (az aznapi nélkül)
  baseline_min_days: 28        # ennél kevesebb érvényes napnál nincs alapvonal / z-pont
  band_z: 1.5                  # |z| >= band_z -> az alapvonal sávján kívül
  regularity_min_nights: 4     # alvási szabályosság (szórás) minimum éjszakaszám az ablakban
  acwr_acute_days: 7
  acwr_chronic_days: 28

# Adatminőség (SPEC 4.5)
quality:
  gap_min_days: 3              # ennyi vagy több egymást követő adathiányos nap = hézag
  nonwear_gap_hours: 3         # pulzusminták közti szünet, ami „nem viselt" jel
  constant_run_samples: 30     # ennyi egymást követő azonos pulzusérték = gyanús (konstans)
  switch_min_days: 3           # forrásváltás csak akkor, ha az új forrás legalább ennyi napig tart
